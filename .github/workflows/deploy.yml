name: DevSecOps Portfolio CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '!infra/security-baseline/**'
      - 'site/api/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/snyk.yml'
  workflow_dispatch: # Allows manual triggering (full pipeline)

permissions:
  contents: read

jobs:
  # Gate: no AWS credentials in the job that runs npm/Snyk code.
  scan:
    uses: ./.github/workflows/snyk.yml
    secrets: inherit

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    # OIDC token only in this job, which runs no third-party package code
    # (npm ci --ignore-scripts just unpacks the Lambda's dependencies).
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-2
      SECURITY_SCORE: ${{ needs.scan.outputs.security-score }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Lambda dependencies and build deployment zip
        working-directory: site/api
        run: |
          npm ci --omit=dev --ignore-scripts
          mkdir -p ../../infra/lambda
          zip -r ../../infra/lambda/stats-api.zip index.js node_modules package.json -x "*.md" >/dev/null
          rm -rf node_modules

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::643913568924:role/GitHub-Actions-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession

      # --- PHASE 1: Terraform (IaC) ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infra/

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: infra/

      - name: Update IaC resource count in SSM
        working-directory: infra
        run: |
          COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
          aws ssm put-parameter --name "/web-server/iac-resource-count" --value "$COUNT" --type String --overwrite

      - name: Publish security score to SSM
        run: |
          aws ssm put-parameter \
            --name "/web-server/security-score" \
            --value "${{ env.SECURITY_SCORE }}" \
            --type String \
            --overwrite

      - name: Invalidate CloudFront cache
        working-directory: infra
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/api/*"
          fi
