name: DevSecOps Portfolio CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'site/api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allows manual triggering (full pipeline)

# --- PERMISSIONS YOU ADDED FOR OIDC ---
permissions:
  id-token: write  # Allows the job to request an OIDC token
  contents: read   # Allows the job to checkout the code

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      SECURITY_SCORE: 98

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js Dependencies (for Snyk Scan)
        run: npm install
        working-directory: site/api/

      - name: Snyk scan and compute security score
        working-directory: site/api
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install
          set +e
          npx snyk@latest test --json-file-output=snyk.json >/dev/null 2>&1
          SNYK_EXIT=$?
          set -e
          SCORE=$(node compute-snyk-score.js snyk.json)
          echo "Security score from Snyk: ${SCORE}"
          echo "SECURITY_SCORE=${SCORE}" >> "$GITHUB_ENV"
          rm -f snyk.json
          npx snyk@latest test --severity-threshold=high

      - name: Install Lambda dependencies and build deployment zip
        working-directory: site/api
        run: |
          npm ci --omit=dev
          mkdir -p ../../infra/lambda
          zip -r ../../infra/lambda/stats-api.zip index.js node_modules package.json -x "*.md" >/dev/null
          rm -rf node_modules

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::643913568924:role/GitHub-Actions-Deploy-Role # Your OIDC Role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsSession

      # --- PHASE 1: Terraform (IaC) ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infra/

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve
        working-directory: infra/

      - name: Update IaC resource count in SSM
        working-directory: infra
        run: |
          COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
          aws ssm put-parameter --name "/web-server/iac-resource-count" --value "$COUNT" --type String --overwrite

      - name: Publish security score to SSM
        run: |
          aws ssm put-parameter \
            --name "/web-server/security-score" \
            --value "${{ env.SECURITY_SCORE }}" \
            --type String \
            --overwrite

      - name: Invalidate CloudFront cache
        working-directory: infra
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/api/*"
          fi