# Fast path: sync static site content to S3 and invalidate CloudFront.
# Run when only site/ (excluding the Lambda source under site/api/) changes,
# or trigger manually.
name: Deploy site content only

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '!site/api/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::643913568924:role/GitHub-Actions-Deploy-Role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsContentDeploy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Get S3 bucket + CloudFront distribution (Terraform outputs)
        id: tf
        run: |
          cd infra
          terraform init -input=false -reconfigure
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "dist_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Sync static site to S3
        run: |
          aws s3 sync site/ "s3://${{ steps.tf.outputs.bucket }}/" --delete --exclude "api/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.dist_id }}" \
            --paths "/*"

      - name: Update IaC resource count in SSM
        run: |
          cd infra
          COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')
          aws ssm put-parameter --name "/web-server/iac-resource-count" --value "$COUNT" --type String --overwrite
