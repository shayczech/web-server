# Weekly update PRs. Minor/patch bumps are grouped per ecosystem to keep the
# PR count down; majors come through individually.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site/api
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/security-baseline
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
